<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>zukaku render page</title>
<link rel="stylesheet" href="../../node_modules/maplibre-gl/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  /* Print margins (2026-08-31 redesign, then uniform-15mm revision): the map
     frame keeps nothing on top of its own content — title/index live in a
     header band above the neatline, the scale bar lives in a footer band
     below it. Uniform on all four sides. Must stay in sync with
     docs/index.html's print CSS (same numbers, ADR 0007 — this layout
     applies to both render paths). */
  #map {
    position: absolute;
    top: 15mm; left: 15mm; right: 15mm; bottom: 15mm;
    box-sizing: border-box;
    /* Neatline: marks exactly where the map frame ends, so the printed page
       reads unambiguously even if trimmed slightly off-square. */
    border: 0.75pt solid #000;
  }
  /* Header band (top margin): title left, grid reference right. */
  #header {
    position: absolute;
    top: 0; left: 15mm; right: 15mm; height: 15mm;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  /* Footer band (bottom margin): scale bar. Compact — this band is no
     taller than the header's. */
  #footer {
    position: absolute;
    bottom: 0; left: 15mm; right: 15mm; height: 15mm;
    display: flex;
    align-items: center;
  }
  #footer .maplibregl-ctrl-scale { margin: 0; font-size: 3mm; }
  #brand, #label { font: bold 5mm/1 sans-serif; color: #222; }
  #label { text-align: right; } /* grid ref (A1, B2, ...) or "概要" */
</style>
</head>
<body>
<div id="map"></div>
<div id="header">
  <div id="brand"></div>
  <div id="label"></div>
</div>
<div id="footer"></div>
<script type="module">
  // maplibre-gl v6 ships ESM-only (dist/maplibre-gl.mjs); there is no more
  // UMD bundle that attaches a global `maplibregl`.
  import { Map as MapLibreMap, ScaleControl } from "../../node_modules/maplibre-gl/dist/maplibre-gl.mjs";

  const params = new URLSearchParams(location.search);
  const styleId = params.get("style") || "positron";
  const bearing = parseFloat(params.get("bearing") || "0");
  const pitch = parseFloat(params.get("pitch") || "0");
  const bboxParam = params.get("bbox"); // "west,south,east,north"
  const ref = params.get("ref"); // grid reference (A1, B2, ...) or "概要", shown top-right
  const gridParam = params.get("grid"); // JSON: [{bbox:[w,s,e,n], label}, ...] — overview page only
  const title = params.get("title"); // optional map title, baked in as plain text (never an <input>)

  // Plain text, top-left, replacing the bare "Zukaku" wordmark when a title
  // is set. This is a styled <div>, not an <input> — the title text box in
  // the picker UI (docs/index.html) never itself gets rendered into the PDF.
  document.getElementById("brand").textContent = title ? `Zukaku: ${title}` : "Zukaku";

  // No city name here (deliberately dropped — ADR 0005, 2026-08-30): the
  // user can pan away from whatever city preset they started from, so a
  // baked-in city label can end up flatly wrong. The grid reference doesn't
  // have that problem — it's derived from the actual grid geometry, not a
  // preset choice.
  if (ref) {
    document.getElementById("label").textContent = ref;
  }

  window.__zukakuReady = false;
  window.__zukakuError = null;

  const mapOptions = {
    container: "map",
    style: `https://stars.optgeo.org/style/${styleId}`,
    bearing: bearing,
    pitch: pitch,
    interactive: false,
    attributionControl: false,
    fadeDuration: 0,
    // ADR 0004: no 3D. Globe projection would also break the "orthogonal
    // top-down page" assumption an atlas depends on, same as terrain would.
    projection: "mercator",
  };

  if (bboxParam) {
    // bbox → camera conversion is delegated to MapLibre GL JS's own fitBounds
    // logic (via the constructor's `bounds` option) rather than reimplemented by
    // hand, so the same projection math the interactive UI uses also drives the
    // headless renderer.
    const [west, south, east, north] = bboxParam.split(",").map(Number);
    mapOptions.bounds = [
      [west, south],
      [east, north],
    ];
    // Overview pages pass a non-zero `padding` (docs/index.html) so the grid
    // block doesn't touch the print frame — detail pages default to 0 to
    // fill the page edge-to-edge, maximizing usable map area.
    const padding = Number(params.get("padding") || "0");
    mapOptions.fitBoundsOptions = { padding, animate: false };
  } else {
    mapOptions.center = [
      parseFloat(params.get("lon") || "139.767"),
      parseFloat(params.get("lat") || "35.681"),
    ];
    mapOptions.zoom = parseFloat(params.get("zoom") || "14");
  }

  const map = new MapLibreMap(mapOptions);

  // Scale bar. This is plain DOM (not the WebGL canvas), so it doesn't need
  // the toDataURL() workaround below — Chromium's print-to-PDF renders
  // ordinary HTML/CSS controls fine on its own. Relocated into #footer (the
  // bottom margin, outside the neatline) once idle — see below. No compass:
  // rotation is locked in the picker UI (docs/index.html) so north is always
  // up, and "地図の内容の上に何も置かない" (put nothing on top of the map
  // itself) extends to this control too, 2026-08-31.
  map.addControl(new ScaleControl({ maxWidth: 100, unit: "metric" }), "bottom-left");

  map.on("error", (e) => {
    window.__zukakuError = String((e && e.error && e.error.message) || e);
  });

  // ADR 0004: zukaku always strips terrain, regardless of what the fetched style
  // declares. A print atlas is composed of separately-printed pages meant to be
  // read (and physically taped together) as an orthogonal top-down view; terrain's
  // perspective tilt would make adjacent pages fail to line up at the seams.
  map.on("load", () => {
    map.setTerrain(null);

    // Overview/index page (ADR 0005): draw each detail page's cell as a
    // rectangle + page-number label, geographically accurate, so the overview
    // becomes a normal map layer baked into the same canvas snapshot below —
    // no separate HTML overlay/compositing step needed.
    if (gridParam) {
      const cells = JSON.parse(gridParam);
      const polygons = {
        type: "FeatureCollection",
        features: cells.map((c) => ({
          type: "Feature",
          properties: {},
          geometry: {
            type: "Polygon",
            coordinates: [
              [
                [c.bbox[0], c.bbox[3]],
                [c.bbox[2], c.bbox[3]],
                [c.bbox[2], c.bbox[1]],
                [c.bbox[0], c.bbox[1]],
                [c.bbox[0], c.bbox[3]],
              ],
            ],
          },
        })),
      };
      const points = {
        type: "FeatureCollection",
        features: cells.map((c) => ({
          type: "Feature",
          properties: { label: c.label },
          geometry: {
            type: "Point",
            coordinates: [(c.bbox[0] + c.bbox[2]) / 2, (c.bbox[1] + c.bbox[3]) / 2],
          },
        })),
      };
      // Field Papers' own sample atlas (fieldpapers.org/atlases/4ibxrgcu) uses
      // plain thin black grid lines and black grid-reference labels, not a
      // bright accent color — matched here deliberately (ADR 0005).
      map.addSource("zukaku-grid-lines", { type: "geojson", data: polygons });
      map.addLayer({
        id: "zukaku-grid-lines",
        type: "line",
        source: "zukaku-grid-lines",
        paint: { "line-color": "#000", "line-width": 1.5 },
      });
      map.addSource("zukaku-grid-labels", { type: "geojson", data: points });
      map.addLayer({
        id: "zukaku-grid-labels",
        type: "symbol",
        source: "zukaku-grid-labels",
        layout: { "text-field": ["get", "label"], "text-size": 28, "text-font": ["Noto Sans Bold"] },
        paint: { "text-color": "#000", "text-halo-color": "#fff", "text-halo-width": 2 },
      });
    }
  });

  map.once("idle", () => {
    // Chromium's print-to-PDF pipeline (used by Playwright's page.pdf()) does not
    // reliably capture live WebGL canvas content. Snapshot the canvas to a PNG data
    // URL and swap it in as a plain <img>, which print-to-PDF handles correctly.
    const canvas = map.getCanvas();
    const dataUrl = canvas.toDataURL("image/png");
    const img = document.createElement("img");
    img.src = dataUrl;
    img.style.position = "absolute";
    img.style.inset = "0";
    img.style.width = "100%";
    img.style.height = "100%";
    // Appended inside #map (the 15mm-inset box) rather than body, so the
    // snapshot lands exactly where the live canvas was, margin included.
    document.getElementById("map").appendChild(img);
    canvas.parentElement.style.display = "none";

    // Move the scale bar out of the map frame entirely, into the footer
    // band below the neatline (2026-08-31: "put nothing on top of the map
    // itself"). A plain reparent, not a clone — it already reflects this
    // page's zoom/latitude, and nothing needs to keep updating after this.
    const scaleEl = map.getContainer().querySelector(".maplibregl-ctrl-scale");
    if (scaleEl) document.getElementById("footer").appendChild(scaleEl);

    window.__zukakuReady = true;
  });
</script>
</body>
</html>

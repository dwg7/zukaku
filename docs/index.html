<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zukaku — 範囲指定</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute;
    z-index: 10;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    padding: 10px 12px;
    font-size: 13px;
    line-height: 1.5;
  }
  .panel h2 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; color: #666; letter-spacing: 0.04em; }

  /* top-left: style selector */
  #style-panel { top: 12px; left: 12px; }
  #style-panel button, #city-panel button {
    display: block;
    width: 100%;
    margin: 2px 0;
    padding: 4px 10px;
    text-align: left;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
  }
  #style-panel button[aria-pressed="true"], #city-panel button[aria-pressed="true"] {
    background: #2b6cb0;
    color: #fff;
    border-color: #2b6cb0;
  }

  /* top-right: city selector */
  #city-panel { top: 12px; right: 12px; }

  /* top-center: m x n / orientation controls */
  #grid-panel {
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  #grid-panel .field { display: flex; align-items: center; gap: 4px; }
  #grid-panel button.step {
    width: 22px; height: 22px;
    border: 1px solid #ccc; border-radius: 4px;
    background: #fff; cursor: pointer; font-weight: bold;
  }
  #grid-panel .value { min-width: 1.5em; text-align: center; font-variant-numeric: tabular-nums; }

  /* top-center, below grid-panel: map title (baked into the PDF's top-left
     brand label, "Zukaku: <title>" — this input box itself never appears in
     the PDF, see scripts/render/page.html). */
  #title-panel {
    top: 56px;
    left: 50%;
    transform: translateX(-50%);
    padding: 6px 8px;
  }
  #title-input {
    width: 220px;
    padding: 6px 10px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  /* bottom-left: action buttons. Print in Browser (ADR 0007) is the
     mainstream path (blue/primary); Share (GitHub Actions, ADR 0006) and
     JSON (local/Docker) are secondary (white), 2026-08-31. */
  #action-panel {
    position: absolute;
    left: 12px;
    bottom: 12px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  #page-estimate {
    font-size: 11px;
    color: #333;
    background: rgba(255, 255, 255, 0.85);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .action-btn {
    font-weight: bold;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    cursor: pointer;
  }
  .action-btn.primary {
    padding: 10px 20px;
    font-size: 14px;
    border: none;
    background: #2b6cb0;
    color: #fff;
  }
  .action-btn.secondary {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: normal;
    border: 1px solid #ccc;
    background: rgba(255, 255, 255, 0.92);
    color: #444;
    box-shadow: none;
  }

  /* Field-Papers-style page grid: fixed to the screen center, NOT to the map.
     The user pans/zooms the map underneath it (ADR 0005). */
  #grid-overlay {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    display: grid;
    outline: 2px solid rgba(0, 0, 0, 0.6);
  }
  #grid-overlay .cell {
    position: relative; /* positions .cell-toggle */
    border: 1px solid rgba(0, 0, 0, 0.6);
    box-sizing: border-box;
  }
  /* Save Paper (ADR 0008): grayed-out cell = omitted from printing. */
  #grid-overlay .cell.excluded { background: rgba(0, 0, 0, 0.35); }
  #grid-overlay .cell-toggle {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.5);
    background: rgba(255, 255, 255, 0.9);
    font-size: 13px;
    line-height: 20px;
    text-align: center;
    color: #333;
    cursor: pointer;
    /* The one part of a cell that opts back into receiving clicks — the
       rest of #grid-overlay stays pointer-events:none so drag-to-pan still
       reaches the map underneath. */
    pointer-events: auto;
  }

  #print-root { display: none; }

  /* ADR 0007: client-side print mode. Named @page rules per orientation let
     one print job mix portrait and landscape pages — verified working via
     Playwright's page.pdf({preferCSSPageSize:true}) before building this
     (that flag makes Playwright honor these same @page rules instead of a
     fixed size, so it's a faithful stand-in for a real "Save as PDF").
     margin:0 here — all spacing is handled by .print-map/.print-header below
     instead, so this stays in lockstep with scripts/render/page.html (which
     also does its own layout rather than relying on a print engine's page
     margin box). */
  @page print-portrait { size: 210mm 297mm; margin: 0; }
  @page print-landscape { size: 297mm 210mm; margin: 0; }

  @media print {
    body > *:not(#print-root) { display: none !important; }
    #print-root { display: block; }
    .print-page {
      position: relative;
      box-sizing: border-box;
      break-after: page;
    }
    .print-page.portrait { page: print-portrait; width: 210mm; height: 297mm; }
    .print-page.landscape { page: print-landscape; width: 297mm; height: 210mm; }

    /* Print margins (2026-08-31, uniform-15mm revision): the map frame keeps
       nothing on top of its own content — title/index live in a header band
       above the neatline, the scale bar lives in a footer band below it.
       Numbers must match scripts/render/page.html's #map/#header/#footer. */
    .print-page .print-map {
      position: absolute;
      top: 15mm; left: 15mm; right: 15mm; bottom: 15mm;
      box-sizing: border-box;
      border: 0.75pt solid #000; /* neatline */
      overflow: hidden;
    }
    .print-page .print-map img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }

    .print-page .print-header {
      position: absolute;
      top: 0; left: 15mm; right: 15mm; height: 15mm;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .print-page .print-brand, .print-page .print-ref {
      font: bold 5mm/1 sans-serif; color: #222;
    }
    .print-page .print-ref { text-align: right; }

    /* Footer band (bottom margin): scale bar only — no compass (rotation is
       locked in the picker UI, so north is always up and a compass would be
       redundant; also "put nothing on top of the map itself", 2026-08-31). */
    .print-page .print-footer {
      position: absolute;
      bottom: 0; left: 15mm; right: 15mm; height: 15mm;
      display: flex;
      align-items: center;
    }
    .print-page .print-footer .maplibregl-ctrl-scale { margin: 0; font-size: 3mm; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="grid-overlay"></div>
<div id="print-root"></div>

<div id="style-panel" class="panel">
  <h2>Style</h2>
  <button data-style="bvmap-dark" aria-pressed="false">bvmap-dark</button>
  <button data-style="positron" aria-pressed="true">positron</button>
  <button data-style="std" aria-pressed="false">std</button>
</div>

<div id="city-panel" class="panel">
  <h2>City</h2>
  <button data-city="obihiro" aria-pressed="true">帯広</button>
  <button data-city="sapporo" aria-pressed="false">札幌</button>
  <button data-city="vientiane" aria-pressed="false">ビエンチャン</button>
</div>

<div id="grid-panel" class="panel">
  <div class="field">
    <span>rows (m)</span>
    <button class="step" data-adjust="rows" data-delta="-1">−</button>
    <span class="value" id="rows-value">1</span>
    <button class="step" data-adjust="rows" data-delta="1">+</button>
  </div>
  <div class="field">
    <span>cols (n)</span>
    <button class="step" data-adjust="cols" data-delta="-1">−</button>
    <span class="value" id="cols-value">1</span>
    <button class="step" data-adjust="cols" data-delta="1">+</button>
  </div>
  <div class="field">
    <button class="step" id="orientation-toggle" style="width: auto; padding: 2px 10px;">
      portrait
    </button>
  </div>
</div>

<!-- Field Papers has a "map title" field in its compose UI; zukaku's
     equivalent. Optional — baked into the PDF as plain text (top-left brand
     label, "Zukaku: <title>"), never as this input box itself. -->
<div id="title-panel" class="panel">
  <input id="title-input" type="text" placeholder="地図のタイトル" maxlength="60">
</div>

<!-- Three ways to turn the current selection into a PDF (2026-08-31: Print is
     the mainstream path). Print in Browser (ADR 0007) renders and calls
     window.print() right here, nothing leaves the tab. Share opens GitHub's
     pre-filled "create file" page (ADR 0005/0006) — the user's own logged-in
     session handles auth, nothing is embedded here — so submitting a PR
     triggers the Actions workflow that runs scripts/render/atlas.js and
     posts the PDF back to docs/responses/. JSON just downloads the page
     spec for local/Docker use. -->
<div id="action-panel">
  <div id="page-estimate"></div>
  <button id="print-btn" class="action-btn primary"
    title="このブラウザで直接PDFを作成し、印刷ダイアログを開きます(Chromium系ブラウザ推奨)">Print</button>
  <button id="share-btn" class="action-btn secondary"
    title="GitHubに新規ファイル画面を開きます。コミット(PR)すると、Actionsが自動でPDFを生成してdocs/responses/に置きます">Share</button>
  <button id="json-btn" class="action-btn secondary"
    title="ページ仕様のJSONをダウンロードします(ローカル/Dockerでの実行向け)">JSON</button>
</div>

<script type="module">
import {
  Map as MapLibreMap,
  ScaleControl,
} from "https://unpkg.com/maplibre-gl@6.6.0/dist/maplibre-gl.mjs";

const STARS = "https://stars.optgeo.org/style";

const CITIES = {
  obihiro: { label: "帯広", center: [143.1954, 42.9203], zoom: 15 },
  sapporo: { label: "札幌", center: [141.3508, 43.0686], zoom: 15 },
  vientiane: { label: "ビエンチャン", center: [102.6331, 17.9757], zoom: 15 },
};

// A4 aspect ratio (width/height), matching scripts/render/lib.js's viewportFor().
const A4_ASPECT = { portrait: 210 / 297, landscape: 297 / 210 };

// A4 at 96 CSS px/inch — matches scripts/render/lib.js's viewportFor(), used
// here to size the offscreen staging map for "Print in Browser" (ADR 0007).
function viewportPxFor(orientation) {
  return orientation === "landscape" ? { width: 1123, height: 794 } : { width: 794, height: 1123 };
}

const state = {
  style: "positron",
  city: "obihiro",
  rows: 1,
  cols: 1,
  orientation: "portrait",
  title: "",
  // Save Paper (ADR 0008): "r,c" keys of grid cells to omit from printing
  // (e.g. a cell that's entirely open water). Cleared whenever rows/cols
  // change, since a stored position may no longer exist or may now mean a
  // different cell.
  excludedCells: new Set(),
};

document.getElementById("title-input").addEventListener("input", (e) => {
  state.title = e.target.value.trim();
});

const map = new MapLibreMap({
  container: "map",
  style: `${STARS}/${state.style}`,
  center: CITIES[state.city].center,
  zoom: CITIES[state.city].zoom,
  // ADR 0004: no 3D. Same reasoning as the headless renderer (page.html).
  projection: "mercator",
  // Rotation locked (2026-08-31 bug fix): computePages() builds each page's
  // bbox as [nw.lng, se.lat, se.lng, nw.lat] from two unprojected screen
  // corners, which is only a valid axis-aligned box when bearing is 0. A
  // rotated map produced a garbled, "crushed" overview frame because that
  // assumption silently broke. Simplest fix, per instruction: don't let the
  // map rotate in the first place, rather than teach the bbox math (and the
  // whole render pipeline) to handle arbitrary bearings.
  dragRotate: false,
  pitchWithRotate: false,
});
map.touchZoomRotate.disableRotation();

window.__zukakuMap = map; // debugging aid
window.__zukakuMapErrors = [];
map.on("error", (e) => window.__zukakuMapErrors.push(String((e && e.error && e.error.message) || e)));
map.on("load", () => map.setTerrain(null));

// --- Style selector (top-left) ---
const stylePanel = document.getElementById("style-panel");
stylePanel.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-style]");
  if (!btn) return;
  state.style = btn.dataset.style;
  for (const b of stylePanel.querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b === btn));
  }
  map.setStyle(`${STARS}/${state.style}`);
  map.once("style.load", () => map.setTerrain(null));
});

// --- City selector (top-right) ---
const cityPanel = document.getElementById("city-panel");
cityPanel.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-city]");
  if (!btn) return;
  state.city = btn.dataset.city;
  for (const b of cityPanel.querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b === btn));
  }
  const c = CITIES[state.city];
  map.flyTo({ center: c.center, zoom: c.zoom });
});

// --- m x n grid + orientation (top-center) ---
const rowsValue = document.getElementById("rows-value");
const colsValue = document.getElementById("cols-value");
const orientationToggle = document.getElementById("orientation-toggle");
const gridOverlay = document.getElementById("grid-overlay");

// Base on-screen cell size (CSS px) for the preview grid; scaled down if the
// full m x n grid would not fit comfortably in the viewport.
const BASE_CELL_WIDTH = 130;

function renderGrid() {
  const aspect = A4_ASPECT[state.orientation]; // width / height
  const cellWidth = BASE_CELL_WIDTH;
  const cellHeight = cellWidth / aspect;

  const totalWidth = cellWidth * state.cols;
  const totalHeight = cellHeight * state.rows;
  const maxWidth = window.innerWidth * 0.7;
  const maxHeight = window.innerHeight * 0.6;
  const scale = Math.min(1, maxWidth / totalWidth, maxHeight / totalHeight);

  gridOverlay.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
  gridOverlay.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;
  gridOverlay.style.width = `${totalWidth * scale}px`;
  gridOverlay.style.height = `${totalHeight * scale}px`;

  // Row-major order matches grid-template-columns/rows filling order, and
  // must match computePages()'s (r, c) iteration so excludedCells keys agree.
  gridOverlay.innerHTML = "";
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const key = `${r},${c}`;
      const excluded = state.excludedCells.has(key);

      const cell = document.createElement("div");
      cell.className = excluded ? "cell excluded" : "cell";
      cell.dataset.row = String(r);
      cell.dataset.col = String(c);

      // Save Paper (ADR 0008): a small dedicated hotspot per cell, not the
      // whole cell — the cell's own area still needs to pass drag/pan
      // gestures through to the map underneath (#grid-overlay itself is
      // pointer-events:none for exactly that reason), so only this button
      // opts back into pointer-events.
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "cell-toggle";
      toggle.textContent = excluded ? "+" : "×";
      toggle.title = excluded
        ? "このページを含める"
        : "このページを印刷から省略する(save paper)";
      cell.appendChild(toggle);

      gridOverlay.appendChild(cell);
    }
  }

  rowsValue.textContent = String(state.rows);
  colsValue.textContent = String(state.cols);
  orientationToggle.textContent = state.orientation;

  renderEstimate();
}

// Rough estimate only — real per-page time varies with tile availability
// (Cloudflare cache hit/miss, see ADR 0002) and isn't worth measuring live
// just for this preview. ~3s/page and ~3s fixed overhead come from actual
// render.js/atlas.js runs logged during development (ADR 0002/0006).
const SECONDS_PER_PAGE = 3;
const FIXED_OVERHEAD_SECONDS = 3;

function renderEstimate() {
  // Save Paper (ADR 0008): excluded cells don't get rendered, so they don't
  // count toward the page total/time estimate either.
  const detailCount = state.rows * state.cols - state.excludedCells.size;
  const totalPages = detailCount + 1; // +1 for the overview page
  const seconds = FIXED_OVERHEAD_SECONDS + totalPages * SECONDS_PER_PAGE;
  const time = seconds < 60 ? `~${seconds}s` : `~${Math.round(seconds / 60)}min`;
  document.getElementById("page-estimate").textContent =
    `${totalPages} pages (incl. overview) · ${time} to render`;
}

document.getElementById("grid-panel").addEventListener("click", (e) => {
  const stepBtn = e.target.closest("button[data-adjust]");
  if (stepBtn) {
    const key = stepBtn.dataset.adjust;
    const delta = Number(stepBtn.dataset.delta);
    state[key] = Math.min(10, Math.max(1, state[key] + delta));
    state.excludedCells.clear(); // grid positions have shifted, stale otherwise
    renderGrid();
    return;
  }
  if (e.target === orientationToggle) {
    state.orientation = state.orientation === "portrait" ? "landscape" : "portrait";
    renderGrid();
  }
});

window.addEventListener("resize", renderGrid);

// Save Paper (ADR 0008): toggle a single cell's excluded state. Delegated on
// gridOverlay since cells are recreated by every renderGrid() call.
gridOverlay.addEventListener("click", (e) => {
  const btn = e.target.closest(".cell-toggle");
  if (!btn) return;
  const cell = btn.closest(".cell");
  const key = `${cell.dataset.row},${cell.dataset.col}`;
  if (state.excludedCells.has(key)) {
    state.excludedCells.delete(key);
  } else {
    state.excludedCells.add(key);
  }
  renderGrid();
});

renderGrid();

// --- Make Atlas (bottom-left) ---
// Per-cell bbox is computed with the live map's own map.unproject(), the same
// projection MapLibre GL JS uses internally, rather than re-deriving Mercator
// math by hand (ADR 0005) — this stays correct even if bearing/pitch controls
// are added to this UI later, unlike scripts/render/grid.js's Node-side math
// (which only supports bearing=0, fine for its own headless-batch use case).
function computePages() {
  const rect = gridOverlay.getBoundingClientRect();
  const cellWidth = rect.width / state.cols;
  const cellHeight = rect.height / state.rows;

  // Page 1 is always an overview/index page (ADR 0005). Detail pages carry a
  // Field-Papers-style grid reference — row letter + column number (A1, A2,
  // B1, B2, ...) — rather than a running page number, matching the sample
  // atlas the user shared (fieldpapers.org/atlases/4ibxrgcu). Because the
  // reference comes straight from grid position, an excluded cell just
  // leaves its letter/number unused (Save Paper, ADR 0008) — no renumbering
  // needed.
  const detailPages = [];
  const allCells = []; // every grid position, including excluded ones — for the overview's index drawing
  for (let r = 0; r < state.rows; r++) {
    for (let c = 0; c < state.cols; c++) {
      const left = rect.left + c * cellWidth;
      const top = rect.top + r * cellHeight;
      const nw = map.unproject([left, top]);
      const se = map.unproject([left + cellWidth, top + cellHeight]);
      const gridRef = `${String.fromCharCode(65 + r)}${c + 1}`;
      const bbox = [nw.lng, se.lat, se.lng, nw.lat]; // west, south, east, north
      const excluded = state.excludedCells.has(`${r},${c}`);
      allCells.push({ bbox, label: gridRef, excluded });
      if (excluded) continue;
      detailPages.push({
        style: state.style,
        bbox,
        orientation: state.orientation,
        ref: gridRef, // shown prominently, top-right (ADR 0005)
        title: state.title || undefined,
      });
    }
  }

  const overallNW = map.unproject([rect.left, rect.top]);
  const overallSE = map.unproject([rect.left + rect.width, rect.top + rect.height]);
  // Pick whichever A4 orientation better matches the full grid's aspect ratio,
  // so the overview page doesn't waste paper on empty margins.
  const cellAspect = A4_ASPECT[state.orientation];
  const overallAspect = (state.cols / state.rows) * cellAspect;
  const overviewOrientation = overallAspect >= 1 ? "landscape" : "portrait";

  const overviewPage = {
    style: state.style,
    bbox: [overallNW.lng, overallSE.lat, overallSE.lng, overallNW.lat],
    orientation: overviewOrientation,
    ref: "概要",
    title: state.title || undefined,
    grid: allCells, // includes excluded cells, grayed out on the overview (ADR 0008)
    // Breathing room around the grid block so it doesn't touch the print
    // frame (user feedback, 2026-08-30: portrait overview looked cramped).
    // Scaled by renderScale below so it stays visually proportional once
    // the oversized render is shrunk back down (2026-08-31). Detail pages
    // keep padding 0 to fill the page edge-to-edge.
    padding: 50 * Math.max(state.cols, state.rows),
    // Zoom-level shift (2026-08-31, ADR 0009): the overview normally has to
    // fit a much larger bbox into the same page-sized frame as a detail
    // page, so it ends up drawn from coarser (lower-zoom) vector-tile data
    // than the detail pages next to it. renderScale tells the render step
    // to stage this page in an offscreen container that many times bigger
    // (one axis per grid dimension) before snapshotting, so MapLibre fits
    // the same bbox at roughly the zoom a detail page would use, then
    // shrink the snapshot back down to the normal print footprint — the
    // same effect as the browser's own "Ctrl + -" page zoom (same tiles
    // fetched, just displayed smaller), scripted instead of relying on
    // real browser zoom. Consumed by preparePrintPages() below and by
    // scripts/render/page.html (via lib.js#renderPage's query string).
    renderScale: { x: state.cols, y: state.rows },
  };

  return [overviewPage, ...detailPages];
}

function downloadJSON(filename, data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

// GitHub's own "create new file" page, pre-filled via query params, opened
// in the viewer's already-logged-in session. No credentials are ever held or
// transmitted by this page — GitHub itself is the entire auth boundary. If
// the viewer lacks push access to GITHUB_BRANCH, GitHub offers "create a new
// branch and start a pull request" on save, same as any "edit this page on
// GitHub" link. See ADR 0006.
const GITHUB_REPO = "dwg7/zukaku";
const GITHUB_BRANCH = "main";

function githubCreateFileUrl(filename, content) {
  const params = new URLSearchParams({ filename, value: content });
  return `https://github.com/${GITHUB_REPO}/new/${GITHUB_BRANCH}?${params}`;
}

function requestFilename() {
  const stamp = new Date().toISOString().replace(/[:.]/g, "-");
  return `docs/requests/atlas-${stamp}.json`;
}

const shareButton = document.getElementById("share-btn");
shareButton.addEventListener("click", () => {
  const pages = computePages();
  const url = githubCreateFileUrl(requestFilename(), JSON.stringify(pages));
  window.open(url, "_blank", "noopener");
});

// --- Print in Browser (ADR 0007) ---
// A second way to turn a `computePages()` array into a PDF, alongside the
// GitHub Actions path (ADR 0006): render every page into a hidden print-only
// document and call window.print(), letting the browser's own "Save as PDF"
// do the rest. No Playwright, no GitHub, nothing leaves this tab. The
// trade-off is the user has to be present to complete the print step, and
// output quality depends on their own browser/OS — see ADR 0007.
//
// Named per-orientation @page rules (print-portrait/print-landscape, defined
// above) let one print job mix portrait and landscape pages; verified this
// actually works in Chromium via a throwaway Playwright spike
// (page.pdf({preferCSSPageSize:true}) honors the same @page rules a real
// "Save as PDF" would) before writing this.
async function preparePrintPages(pages) {
  const printRoot = document.getElementById("print-root");
  printRoot.innerHTML = "";

  for (const spec of pages) {
    const orientation = spec.orientation === "landscape" ? "landscape" : "portrait";
    const pxSize = viewportPxFor(orientation);
    // Zoom-level shift (ADR 0009): stage the overview in a bigger-than-usual
    // container so it fits its (much larger) bbox at close to the same zoom
    // a detail page would — see the renderScale comment in computePages().
    // The final display size is unaffected: .print-map's CSS box stays
    // fixed and the snapshot <img> is scaled to fill it (object-fit: fill).
    if (spec.renderScale) {
      pxSize.width *= spec.renderScale.x;
      pxSize.height *= spec.renderScale.y;
    }

    // Offscreen staging container: MapLibre needs a real laid-out element to
    // size its canvas against, so this can't be display:none. Hidden via
    // opacity + pointer-events rather than parked at a large negative
    // offset (issue #4, 2026-08-31) — a real browser's print pipeline (as
    // opposed to Playwright's page.pdf(), a different code path — see
    // ADR 0009) produced RGB-fringed, garbled scale-bar text specifically
    // for the overview page, whose staging container is the one that gets
    // dramatically larger (renderScale). Keeping every staging container
    // near the normal document flow removes that variable regardless of
    // size. Removed as soon as this page's snapshot is taken.
    const stage = document.createElement("div");
    stage.style.cssText = `position:fixed; top:0; left:0; opacity:0; pointer-events:none; width:${pxSize.width}px; height:${pxSize.height}px;`;
    document.body.appendChild(stage);

    const pageMap = new MapLibreMap({
      container: stage,
      style: `${STARS}/${spec.style}`,
      bounds: [
        [spec.bbox[0], spec.bbox[1]],
        [spec.bbox[2], spec.bbox[3]],
      ],
      fitBoundsOptions: { padding: spec.padding || 0, animate: false },
      projection: "mercator", // ADR 0004: no 3D, same as scripts/render/page.html
      interactive: false,
      attributionControl: false,
      fadeDuration: 0,
    });
    // Scale bar only — no compass. Rotation is locked (state, above) so
    // north is always up, making a compass redundant; and "put nothing on
    // top of the map itself" (2026-08-31) extends to this control too, so
    // it's relocated into a footer band below the neatline, not left
    // floating over the map image.
    pageMap.addControl(new ScaleControl({ maxWidth: 100, unit: "metric" }), "bottom-left");

    await new Promise((resolve, reject) => {
      pageMap.on("error", (e) => reject(e.error || e));
      pageMap.on("load", () => {
        pageMap.setTerrain(null);
        if (spec.grid) addOverviewGridLayers(pageMap, spec.grid);
      });
      pageMap.once("idle", resolve);
    });

    // Same WebGL-canvas-doesn't-survive-print workaround as
    // scripts/render/page.html (ADR 0002) — applies here too, since this is
    // the same underlying Chromium print pipeline, just invoked via
    // window.print() instead of Playwright's page.pdf().
    const dataUrl = pageMap.getCanvas().toDataURL("image/png");
    // The scale control's own markup (not user-supplied, safe to carry over
    // as static HTML) — the live container it depended on for positioning
    // is gone once this map is removed, so it's re-homed in .print-footer.
    const scaleEl = pageMap.getContainer().querySelector(".maplibregl-ctrl-scale");
    const scaleHTML = scaleEl ? scaleEl.outerHTML : "";

    pageMap.remove(); // free the WebGL context before starting the next page
    stage.remove();

    const section = document.createElement("section");
    section.className = `print-page ${orientation}`;

    // Header band (above the neatline): title left, grid reference right —
    // matches scripts/render/page.html's #header.
    const header = document.createElement("div");
    header.className = "print-header";
    const brand = document.createElement("div");
    brand.className = "print-brand";
    brand.textContent = spec.title ? `Zukaku: ${spec.title}` : "Zukaku";
    header.appendChild(brand);
    if (spec.ref) {
      const ref = document.createElement("div");
      ref.className = "print-ref";
      ref.textContent = spec.ref;
      header.appendChild(ref);
    }
    section.appendChild(header);

    // Map box: neatline + snapshot only, nothing else on top of it.
    const mapBox = document.createElement("div");
    mapBox.className = "print-map";
    const img = document.createElement("img");
    img.src = dataUrl;
    mapBox.appendChild(img);
    section.appendChild(mapBox);

    // Footer band (below the neatline): scale bar — matches
    // scripts/render/page.html's #footer.
    const footer = document.createElement("div");
    footer.className = "print-footer";
    footer.innerHTML = scaleHTML;
    section.appendChild(footer);

    printRoot.appendChild(section);
  }
}

// Same overview-page grid overlay as scripts/render/page.html: draw each
// detail page's cell as a rectangle + grid-reference label.
function addOverviewGridLayers(pageMap, cells) {
  const polygons = {
    type: "FeatureCollection",
    features: cells.map((c) => ({
      type: "Feature",
      properties: { excluded: !!c.excluded },
      geometry: {
        type: "Polygon",
        coordinates: [
          [
            [c.bbox[0], c.bbox[3]],
            [c.bbox[2], c.bbox[3]],
            [c.bbox[2], c.bbox[1]],
            [c.bbox[0], c.bbox[1]],
            [c.bbox[0], c.bbox[3]],
          ],
        ],
      },
    })),
  };
  // Save Paper (ADR 0008): an excluded cell keeps its outline on the
  // overview (so the grid still reads as complete) but gets no reference
  // label — a skipped index number, not a mistake.
  const points = {
    type: "FeatureCollection",
    features: cells
      .filter((c) => !c.excluded)
      .map((c) => ({
        type: "Feature",
        properties: { label: c.label },
        geometry: {
          type: "Point",
          coordinates: [(c.bbox[0] + c.bbox[2]) / 2, (c.bbox[1] + c.bbox[3]) / 2],
        },
      })),
  };
  pageMap.addSource("zukaku-grid-lines", { type: "geojson", data: polygons });
  pageMap.addLayer({
    id: "zukaku-grid-excluded-fill",
    type: "fill",
    source: "zukaku-grid-lines",
    filter: ["==", ["get", "excluded"], true],
    paint: { "fill-color": "#000", "fill-opacity": 0.15 },
  });
  pageMap.addLayer({
    id: "zukaku-grid-lines",
    type: "line",
    source: "zukaku-grid-lines",
    paint: { "line-color": "#000", "line-width": 1.5 },
  });
  pageMap.addSource("zukaku-grid-labels", { type: "geojson", data: points });
  pageMap.addLayer({
    id: "zukaku-grid-labels",
    type: "symbol",
    source: "zukaku-grid-labels",
    layout: { "text-field": ["get", "label"], "text-size": 28, "text-font": ["Noto Sans Bold"] },
    paint: { "text-color": "#000", "text-halo-color": "#fff", "text-halo-width": 2 },
  });
}

const printButton = document.getElementById("print-btn");
printButton.addEventListener("click", async () => {
  const pages = computePages();
  const original = printButton.textContent;
  printButton.textContent = `Rendering (${pages.length} pages)…`;
  printButton.disabled = true;
  try {
    await preparePrintPages(pages);
    window.print();
  } catch (err) {
    console.error(err);
    alert(`Print preparation failed: ${err.message || err}`);
  } finally {
    printButton.textContent = original;
    printButton.disabled = false;
  }
});

const downloadJsonButton = document.getElementById("json-btn");
downloadJsonButton.addEventListener("click", () => {
  const pages = computePages();
  downloadJSON("atlas-pages.json", pages);

  const original = downloadJsonButton.textContent;
  downloadJsonButton.textContent = `Downloaded (${pages.length} pages)`;
  setTimeout(() => {
    downloadJsonButton.textContent = original;
  }, 2000);
});
</script>
</body>
</html>
